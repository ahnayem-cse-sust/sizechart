# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "c6fc7520a4e94bf94c1475790f539245"
name = "Size Chart"
handle = "asl-size-chart"
application_url = "https://une-planner-actor-biography.trycloudflare.com"
embedded = true

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2025-04"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_products,write_products"

[app_proxy]
# Lets the storefront theme extension fetch chart data from our own
# shop domain (avoids CORS and hardcoded tunnel URLs). Requests to
# https://{shop}/apps/sizechart/* are forwarded here.
url = "https://une-planner-actor-biography.trycloudflare.com/proxy/sizechart"
subpath = "sizechart"
prefix = "apps"

[auth]
redirect_urls = ["https://une-planner-actor-biography.trycloudflare.com/auth/callback", "https://une-planner-actor-biography.trycloudflare.com/auth/shopify/callback", "https://une-planner-actor-biography.trycloudflare.com/api/auth/callback"]

[pos]
embedded = false
